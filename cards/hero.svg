<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<style>
text{font-family:ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace}
.name{font-size:52px;font-weight:700;fill:#e6f7ff}
.sub{font-size:18px;fill:#7d8aa3}
.accent{fill:#00f7ff}
.art{font-size:8px;fill:#00f7ff;opacity:.85;white-space:pre}
.rule{stroke:#00f7ff;stroke-width:1.5}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:.85}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{50%{opacity:0}}
.name{animation:rise .8s .1s both}.sub{animation:rise .8s .4s both}.rule{transform-origin:left;transform-box:fill-box;animation:grow .9s .6s both}.cursor{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="330" rx="14" fill="#0b0f19"/>
<rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="none" stroke="#1d2a44"/>
